name: Bot eproc TJSP - captação de processos

on:
  schedule:
    # Expediente de 10h (8h-18h Brasília), 2 disparos por dia.
    - cron: '0 11 * * 1-5'   # 08:00 em Brasília
    - cron: '0 17 * * 1-5'   # 14:00 em Brasília
  workflow_dispatch:
    inputs:
      ignorar_horario:
        description: 'Rodar mesmo fora da janela 8h-18h (só para testes manuais)'
        type: boolean
        default: false

jobs:
  captar-processos:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Xvfb (tela virtual) e dependências do navegador
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Escrever credencial do Firebase (principal do eproc)
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPROC_JSON }}
        run: |
          echo "$FIREBASE_JSON" > firebase-service-account-eproc.json

      - name: Escrever credenciais do Firebase (failovers — mesmos do bot PJe)
        env:
          FAILOVER_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FAILOVER_JSON }}
          FAILOVER2_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FAILOVER2_JSON }}
          FAILOVER3_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FAILOVER3_JSON }}
        run: |
          echo "$FAILOVER_JSON" > firebase-service-account-failover.json
          echo "$FAILOVER2_JSON" > firebase-service-account-failover2.json
          echo "$FAILOVER3_JSON" > firebase-service-account-failover3.json

      - name: Rodar o bot dentro do Xvfb (loop contínuo até 17h ou o timeout do job)
        env:
          EPROC_SP_USUARIO: ${{ secrets.EPROC_SP_USUARIO }}
          EPROC_SP_SENHA: ${{ secrets.EPROC_SP_SENHA }}
          EPROC_SP_TOTP_SECRET: ${{ secrets.EPROC_SP_TOTP_SECRET }}
          IGNORAR_HORARIO: ${{ github.event.inputs.ignorar_horario }}
          # status_bots.py usa esse mesmo arquivo de credencial (em
          # vez de um segundo projeto/secret separado — mais simples,
          # mas isso significa que o status/heartbeat fica salvo no
          # MESMO projeto Firebase dos "processos", não num projeto
          # "botorion2" separado.
          BOTORION2_CREDENCIAL_PATH: firebase-service-account-eproc.json
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a python bot_eproc_sp.py

      - name: Publicar screenshots de diagnóstico (se algo falhou)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-eproc-sp
          path: debug_eproc_sp/
          if-no-files-found: ignore
          retention-days: 5
